name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "app/build/outputs/apk/debug/YouTube Downloader.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-apk
          path: "app/build/outputs/apk/debug/YouTube Downloader.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Debug APK
          files: |
            app/build/outputs/apk/debug/YouTube Downloader.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
